[[sections]]
title = "About Me"
description = "I am a multidisciplinary software engineer, technical leader and former company director who brings together hands-on engineering, business analysis, stakeholder engagement and communications. My background spans university and public sector projects, international software companies, cloud infrastructure, autonomous robotics and community service. I turn complex challenges into practical solutions, engage the people who matter and help teams deliver lasting value."
direction = "column"
item_style = "outline"
icon_size = "30px"

[[sections]]
title = "Professional Focus"
description = "I am interested in senior software engineering, principal and technical lead roles, technology consulting, industry and stakeholder engagement, strategic partnerships, corporate communications and community leadership. I bring both the ability to design and implement systems and the judgement to align technical decisions with organisational and community needs."
direction = "column"
item_style = "outline"
icon_size = "30px"

[[sections]]
title = "Software Engineering and Systems Architecture"
description = "Experience across C++, Python, Rust, TypeScript, cloud APIs, WebAssembly(Wasm), data integration, telemetry and automation. I design, troubleshoot and integrate complex systems, from low-level data interoperability to production services and customer-facing applications. My most recent work in agricultural autonomy connects robot APIs, cloud services and operational notifications, with an emphasis on reliability, practical outcomes and clear technical documentation."
