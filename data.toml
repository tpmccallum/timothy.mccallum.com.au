[[sections]]
title = "Leadership and Board Experience"
description = "My experience includes serving as a director of VTM Consulting Pty. Ltd. and as a director of the University of Southern Queensland Student Guild, leading business analysis at Toowoomba Regional Council and delivering university projects for senior stakeholders. I combine technical direction with planning, clear communication, mentoring, risk awareness and practical delivery. I have worked with executive leaders, engineering teams, customers and external partners across organisational boundaries."
direction = "column"
item_style = "outline"
icon_size = "30px"

[[sections]]
title = "Stakeholder Engagement and Strategic Partnerships"
description = "I connect technical teams, business leaders, industry partners and customers to clarify requirements, resolve complex issues and create shared outcomes. My experience includes B2B technology relationships, customer engagement, requirements analysis, technical presentations, training, strategic problem solving and stakeholder communications. I focus on trust, accountability, measurable outcomes and follow-through.
direction = "column"
item_style = "outline"
icon_size = "30px"

[[sections]]
title = "Corporate Communications and Technical Writing"
description = "I translate complex ideas into accessible, accurate content for technical, executive and public audiences. As a Digital Content Specialist at Fermyon Technologies, I developed documentation and publications for international developer communities. My work also includes industry storytelling, customer success communications, media collaboration, editing, presentations and communicating business and technical change."
