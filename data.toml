description = "Mentoring, coaching and developing others are central to my leadership approach. I have been recognised as a Google Summer of Code (GSoC) Mentor. I attended the GSoC 10-year reunion at Google Headquarters in Silicon Valley. I was awarded EOS Global Hackathon Most Valuable Mentor and also an AMP Tomorrow Maker Award recipient."
