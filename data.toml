[[sections]]
title = "Agricultural Robotics and Customer Systems"
description = "Former Principal Autonomy Specialist and Customer Systems Lead at Agri Automation Australia (March to October 2026), following a Support and Deployment Technician role from August 2025. I worked across GNSS, RTK positioning, connectivity, robot integrations, remote monitoring, operator training, customer support and field operations. I collaborated with technical partners and customers to improve deployment quality, issue resolution and operational visibility."
direction = "column"
item_style = "outline"
icon_size = "30px"

[[sections]]
title = "Community Leadership and Emergency Services"
description = "I volunteer as an Emergency Services Cadets Adult Leader with PCYC Queensland at Highfields. I support cadet development through practical learning, safety awareness, teamwork, mentoring and community engagement, connecting young people with emergency services and local community organisations. My commitment to PCYC also includes earlier participation (at Toowoomba PCYC) in Renbukan Karate and volunteering as a PCYC fitness coach."
direction = "column"
item_style = "outline"
icon_size = "30px"

[[sections]]
